<app-modal-shell
  [title]="sacramentDisplayName + ' Details'"
  [description]="isBaptism ? 'Update baptism record, godparents, and parish information.' : 'Update sacramental record for ' + member.first_name + ' ' + member.last_name + '.'"
  size="xl"
  [isSubmitting]="loading"
  (closeRequested)="cancel()"
>
  <form id="sacrament-form" [formGroup]="form" (ngSubmit)="save()">
    <div class="error-banner" *ngIf="error">
      <span class="icon">⚠️</span>
      <span>{{ error }}</span>
    </div>

    <ng-container *ngIf="isBaptism; else generalSacrament">
      <h4 class="section-title">Baptism Details</h4>
      <div class="form-grid form-section">
        <label class="form-field">
          <span class="label">Baptism Date</span>
          <input type="date" formControlName="baptism_date">
        </label>

        <div class="form-field">
          <span class="label">Location</span>
          <div class="radio-group">
            <label>
              <input type="radio" value="home_parish" formControlName="baptism_location_type">
              Home Parish
            </label>
            <label>
              <input type="radio" value="other" formControlName="baptism_location_type">
              Another Church
            </label>
          </div>
        </div>

        <label class="form-field">
          <span class="label">Church Name</span>
          <input type="text" formControlName="baptism_church_name" placeholder="Enter church name">
        </label>

        <label class="form-field stretch">
          <span class="label">Church Address</span>
          <textarea formControlName="baptism_church_address" rows="2" placeholder="Enter church address"></textarea>
        </label>

        <label class="form-field">
          <span class="label">Primary Godparent</span>
          <input type="text" formControlName="baptism_godparent_primary" placeholder="Enter name">
        </label>

        <label class="form-field">
          <span class="label">Secondary Godparent</span>
          <input type="text" formControlName="baptism_godparent_secondary" placeholder="Enter name">
        </label>

        <div class="form-field">
          <span class="label">Priest</span>
          <label class="toggle">
            <input type="checkbox" formControlName="baptism_priest_is_home">
            <span>Ministered by home parish priest</span>
          </label>
          <input type="text" class="mt-2" formControlName="baptism_priest_name" placeholder="Enter priest name">
        </div>

        <label class="form-field stretch">
          <span class="label">Baptism Place Summary</span>
          <textarea formControlName="baptism_place" rows="2" placeholder="Displayed in family records"></textarea>
        </label>
      </div>
    </ng-container>

    <ng-template #generalSacrament>
      <ng-container [ngSwitch]="sacrament">
        <ng-container *ngSwitchCase="'first_communion'">
          <h4 class="section-title">First Communion Details</h4>
          <div class="form-grid form-section">
            <label class="form-field">
              <span class="label">First Communion Date</span>
              <input type="date" formControlName="first_communion_date">
            </label>

            <div class="form-field">
              <span class="label">Location</span>
              <div class="radio-group">
                <label>
                  <input type="radio" value="home_parish" formControlName="first_communion_location_type">
                  Home Parish
                </label>
                <label>
                  <input type="radio" value="other" formControlName="first_communion_location_type">
                  Another Church
                </label>
              </div>
            </div>

            <label class="form-field">
              <span class="label">Church Name</span>
              <input type="text" formControlName="first_communion_church_name" placeholder="Enter church name">
            </label>

            <label class="form-field stretch">
              <span class="label">Church Address</span>
              <textarea formControlName="first_communion_church_address" rows="2" placeholder="Enter church address"></textarea>
            </label>

            <div class="form-field">
              <span class="label">Priest</span>
              <label class="toggle">
                <input type="checkbox" formControlName="first_communion_priest_is_home">
                <span>Ministered by home parish priest</span>
              </label>
              <input type="text" class="mt-2" formControlName="first_communion_priest_name" placeholder="Enter priest name">
            </div>

            <label class="form-field stretch">
              <span class="label">Description</span>
              <textarea formControlName="first_communion_description" rows="2" placeholder="Notes shown in family records"></textarea>
            </label>
          </div>
        </ng-container>

        <ng-container *ngSwitchCase="'marriage'">
          <h4 class="section-title">Marriage Details</h4>
          <div class="form-grid form-section three-column">
            <label class="form-field">
              <span class="label">Marriage Date</span>
              <input type="date" formControlName="marriage_date">
            </label>

            <label class="form-field">
              <span class="label">Marriage Place</span>
              <input type="text" formControlName="marriage_place" placeholder="Enter marriage place">
            </label>

            <label class="form-field">
              <span class="label">Minister Name</span>
              <input type="text" formControlName="marriage_minister_name" placeholder="e.g., Rev. John Doe">
            </label>

            <label class="form-field">
              <span class="label">Minister Title</span>
              <input type="text" formControlName="marriage_minister_title" placeholder="Parish Priest, Bishop, etc.">
            </label>

          </div>

          <div class="section-divider">
            <h4 class="section-title">Bride Details</h4>
          </div>

          <div class="form-grid form-section three-column">
            <label class="form-field">
              <span class="label">Full Name</span>
              <input type="text" formControlName="marriage_bride_full_name" placeholder="Enter bride's full name">
            </label>
            <label class="form-field">
              <span class="label">Father's Name</span>
              <input type="text" formControlName="marriage_bride_father_name" placeholder="Enter bride's father name">
            </label>
            <label class="form-field">
              <span class="label">Mother's Name</span>
              <input type="text" formControlName="marriage_bride_mother_name" placeholder="Enter bride's mother name">
            </label>
            <label class="form-field stretch">
              <span class="label">Address</span>
              <textarea formControlName="marriage_bride_address" rows="2" placeholder="Enter bride's address"></textarea>
            </label>
            <div class="form-field">
              <span class="label">Home Parish</span>
              <div class="radio-group">
                <label>
                  <input type="radio" value="home_parish" formControlName="marriage_bride_church_type">
                  Home Parish
                </label>
                <label>
                  <input type="radio" value="other" formControlName="marriage_bride_church_type">
                  Other Church
                </label>
              </div>
            </div>
            <label class="form-field">
              <span class="label">Church Name</span>
              <input type="text" formControlName="marriage_bride_church_name" placeholder="Enter church name">
            </label>
            <label class="form-field stretch">
              <span class="label">Church Address</span>
              <textarea formControlName="marriage_bride_church_address" rows="2" placeholder="Enter church address"></textarea>
            </label>
          </div>

          <div class="section-divider">
            <h4 class="section-title">Groom Details</h4>
            <button type="button" class="link-button" (click)="copyBrideChurchToGroom()">Copy bride church to groom</button>
          </div>

          <div class="form-grid form-section three-column">
            <label class="form-field">
              <span class="label">Full Name</span>
              <input type="text" formControlName="marriage_groom_full_name" placeholder="Enter groom's full name">
            </label>
            <label class="form-field">
              <span class="label">Father's Name</span>
              <input type="text" formControlName="marriage_groom_father_name" placeholder="Enter groom's father name">
            </label>
            <label class="form-field">
              <span class="label">Mother's Name</span>
              <input type="text" formControlName="marriage_groom_mother_name" placeholder="Enter groom's mother name">
            </label>
            <label class="form-field stretch">
              <span class="label">Address</span>
              <textarea formControlName="marriage_groom_address" rows="2" placeholder="Enter groom's address"></textarea>
            </label>
            <div class="form-field">
              <span class="label">Home Parish</span>
              <div class="radio-group">
                <label>
                  <input type="radio" value="home_parish" formControlName="marriage_groom_church_type">
                  Home Parish
                </label>
                <label>
                  <input type="radio" value="other" formControlName="marriage_groom_church_type">
                  Other Church
                </label>
              </div>
            </div>
            <label class="form-field">
              <span class="label">Church Name</span>
              <input type="text" formControlName="marriage_groom_church_name" placeholder="Enter church name">
            </label>
            <label class="form-field stretch">
              <span class="label">Church Address</span>
              <textarea formControlName="marriage_groom_church_address" rows="2" placeholder="Enter church address"></textarea>
            </label>
          </div>

        </ng-container>

        <ng-container *ngSwitchDefault>
          <h4 class="section-title">{{ sacramentDisplayName }} Details</h4>
          <div class="form-grid form-section small">
            <label class="form-field">
              <span class="label">{{ sacramentDisplayName }} Date</span>
              <input type="date" [formControlName]="sacrament + '_date'">
            </label>

            <label class="form-field">
              <span class="label">{{ sacrament === 'confirmation' ? 'Confirmation Place' : 'Communion Place' }}</span>
              <input type="text" [formControlName]="sacrament + '_place'" placeholder="Enter place details">
            </label>
          </div>
        </ng-container>
      </ng-container>
    </ng-template>
  </form>

  <ng-container modalFooter>
    <button type="button" class="cf-btn" (click)="cancel()" [disabled]="loading">Cancel</button>
    <button type="submit" form="sacrament-form" class="cf-btn cf-btn-primary" [disabled]="loading || form.invalid">
      {{ loading ? 'Saving…' : 'Save Changes' }}
    </button>
  </ng-container>
</app-modal-shell>
