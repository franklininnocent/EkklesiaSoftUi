<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2>{{ family ? 'Edit' : 'Add' }} Family</h2>
      <button class="close-btn" type="button" (click)="onCancel()">✕</button>
    </div>

    <!-- Error Message -->
    <div class="error-banner" *ngIf="error">
      <span class="error-icon">⚠️</span>
      {{ error }}
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button 
        type="button"
        class="tab" 
        [class.active]="activeTab === 'info'"
        (click)="switchTab('info')"
      >
        Family Information
      </button>
      <button 
        type="button"
        class="tab" 
        [class.active]="activeTab === 'members'"
        (click)="switchTab('members')"
      >
        Members ({{ members.length }})
      </button>
    </div>

    <form [formGroup]="familyForm" (ngSubmit)="onSubmit()">
      <!-- Tab: Family Info -->
      <div class="tab-content" *ngIf="activeTab === 'info'">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Family Name <span class="required">*</span></label>
            <input 
              type="text" 
              formControlName="family_name" 
              class="form-control"
              [class.error]="hasError('family_name')"
              placeholder="Enter family name"
            />
            <span class="error-text" *ngIf="hasError('family_name')">
              Family name is required
            </span>
          </div>

          <div class="form-group">
            <label>Address Line 1</label>
            <input 
              type="text" 
              formControlName="address_line_1" 
              class="form-control"
              placeholder="Street address"
            />
          </div>

          <div class="form-group">
            <label>Address Line 2</label>
            <input 
              type="text" 
              formControlName="address_line_2" 
              class="form-control"
              placeholder="Apartment, suite, etc."
            />
          </div>

          <div class="form-group">
            <label>City</label>
            <input 
              type="text" 
              formControlName="city" 
              class="form-control"
              placeholder="City"
            />
          </div>

          <div class="form-group">
            <label>Postal Code</label>
            <input 
              type="text" 
              formControlName="postal_code" 
              class="form-control"
              placeholder="Postal code"
            />
          </div>

          <div class="form-group">
            <label>BCC</label>
            <select formControlName="bcc_id" class="form-control">
              <option value="">Not Assigned</option>
              <option *ngFor="let bcc of bccs" [value]="bcc.id">
                {{ bcc.name }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label>Primary Phone</label>
            <input 
              type="tel" 
              formControlName="primary_phone" 
              class="form-control"
              placeholder="+1234567890"
            />
          </div>

          <div class="form-group">
            <label>Secondary Phone</label>
            <input 
              type="tel" 
              formControlName="secondary_phone" 
              class="form-control"
              placeholder="+1234567890"
            />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input 
              type="email" 
              formControlName="email" 
              class="form-control"
              [class.error]="hasError('email')"
              placeholder="family@example.com"
            />
            <span class="error-text" *ngIf="hasError('email')">
              Please enter a valid email
            </span>
          </div>

          <div class="form-group">
            <label>Status</label>
            <select formControlName="status" class="form-control">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="migrated">Migrated</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label>Notes</label>
            <textarea 
              formControlName="notes" 
              class="form-control" 
              rows="3"
              placeholder="Any additional notes..."
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Tab: Members -->
      <div class="tab-content members-tab" *ngIf="activeTab === 'members'">
        <div class="members-header">
          <button type="button" class="btn btn-primary" (click)="openAddMemberModal()">
            <span class="icon">➕</span> Add Member
          </button>
        </div>

        <div formArrayName="members" class="members-list">
          <div *ngFor="let member of members.controls; let i = index" 
               [formGroupName]="i" 
               class="member-card">
            <div class="member-header">
              <h4>Member {{ i + 1 }}</h4>
              <button 
                type="button" 
                class="btn-icon" 
                (click)="openEditMemberModal(i)"
                title="Edit member"
              >
                ✎
              </button>
              <button 
                type="button" 
                class="btn-icon btn-danger" 
                (click)="removeMember(i)"
                title="Remove member"
              >
                🗑️
              </button>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label>First Name <span class="required">*</span></label>
                <input 
                  type="text" 
                  formControlName="first_name" 
                  class="form-control"
                  [class.error]="hasMemberError(i, 'first_name')"
                />
              </div>

              <div class="form-group">
                <label>Middle Name</label>
                <input type="text" formControlName="middle_name" class="form-control" />
              </div>

              <div class="form-group">
                <label>Last Name <span class="required">*</span></label>
                <input 
                  type="text" 
                  formControlName="last_name" 
                  class="form-control"
                  [class.error]="hasMemberError(i, 'last_name')"
                />
              </div>

              <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" formControlName="date_of_birth" class="form-control" />
              </div>

              <div class="form-group">
                <label>Gender</label>
                <select formControlName="gender" class="form-control">
                  <option value="">Select</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label>Relationship <span class="required">*</span></label>
                <select formControlName="relationship_to_head" class="form-control">
                  <option value="self">Self (Head)</option>
                  <option value="spouse">Spouse</option>
                  <option value="son">Son</option>
                  <option value="daughter">Daughter</option>
                  <option value="father">Father</option>
                  <option value="mother">Mother</option>
                  <option value="brother">Brother</option>
                  <option value="sister">Sister</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label>Marital Status</label>
                <select formControlName="marital_status" class="form-control">
                  <option value="single">Single</option>
                  <option value="married">Married</option>
                  <option value="widowed">Widowed</option>
                  <option value="separated">Separated</option>
                  <option value="divorced">Divorced</option>
                </select>
              </div>

              <div class="form-group">
                <label>Phone</label>
                <input type="tel" formControlName="phone" class="form-control" />
              </div>

              <div class="form-group">
                <label>Email</label>
                <input 
                  type="email" 
                  formControlName="email" 
                  class="form-control"
                  [class.error]="hasMemberError(i, 'email')"
                />
              </div>

              <div class="form-group">
                <label>Occupation</label>
                <input type="text" formControlName="occupation" class="form-control" />
              </div>

              <div class="form-group">
                <label>Education</label>
                <input type="text" formControlName="education" class="form-control" />
              </div>

              <div class="form-group">
                <label>Status</label>
                <select formControlName="status" class="form-control">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                  <option value="deceased">Deceased</option>
                  <option value="migrated">Migrated</option>
                </select>
              </div>

              <!-- Sacraments Section -->
              <div class="form-group">
                <label>Baptism Date</label>
                <input type="date" formControlName="baptism_date" class="form-control" />
              </div>

              <div class="form-group">
                <label>First Communion</label>
                <input type="date" formControlName="first_communion_date" class="form-control" />
              </div>

              <div class="form-group">
                <label>Confirmation</label>
                <input type="date" formControlName="confirmation_date" class="form-control" />
              </div>
            </div>
          </div>

          <div *ngIf="members.length === 0" class="empty-members">
            <div class="empty-icon">👥</div>
            <p>No members added yet</p>
            <p class="empty-hint">Click "Add Member" to add family members</p>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <button 
          type="button" 
          class="btn btn-secondary" 
          (click)="onCancel()" 
          [disabled]="loading"
        >
          Cancel
        </button>
        <button 
          type="submit" 
          class="btn btn-primary" 
          [disabled]="!familyForm.valid || loading"
        >
          <span *ngIf="!loading">
            <span class="icon">💾</span> Save Family
          </span>
          <span *ngIf="loading">Saving...</span>
        </button>
      </div>
    </form>
    
    <!-- Member Modal -->
    <app-family-member-form-modal
      *ngIf="showMemberModal"
      [member]="memberToEditIndex !== null ? (members.at(memberToEditIndex)?.value) : null"
      (save)="onMemberModalSave($event)"
      (cancel)="onMemberModalCancel()">
    </app-family-member-form-modal>
  </div>
</div>
