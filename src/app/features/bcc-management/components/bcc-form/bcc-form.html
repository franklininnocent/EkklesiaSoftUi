<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ bcc ? 'Edit' : 'Add' }} BCC</h2>
      <button class="close-btn" type="button" (click)="onCancel()">✕</button>
    </div>

    <div class="error-banner" *ngIf="error">
      <span class="error-icon">⚠️</span>
      {{ error }}
    </div>

    <form [formGroup]="bccForm" (ngSubmit)="onSubmit()">
      <div class="form-content" #formContent>
        <div class="form-grid">
          <!-- Basic Information Section -->
          <div class="form-section-header full-width">
            <h3>Basic & Status</h3>
          </div>

          <!-- BCC Code (Read-only, shown in edit mode only) -->
          <div class="form-group" *ngIf="bcc">
            <label>BCC Code</label>
            <input 
              type="text" 
              formControlName="bcc_code" 
              class="form-control"
              readonly
              [style.background-color]="'#f7fafc'"
              [style.cursor]="'not-allowed'"
            />
            <small class="form-hint">Auto-generated unique code</small>
          </div>

          <div class="form-group" [class.full-width]="!bcc">
            <label>BCC Name <span class="required">*</span></label>
            <input 
              type="text" 
              formControlName="name" 
              class="form-control"
              [class.error]="hasError('name')"
              placeholder="Enter BCC name"
            />
            <span class="field-error" *ngIf="hasError('name')">
              {{ getErrorMessage('name') }}
            </span>
          </div>

          <div class="form-group full-width">
            <label>Description</label>
            <textarea 
              formControlName="description" 
              class="form-control" 
              rows="3"
              placeholder="Brief description of the BCC"
            ></textarea>
            <small class="form-hint">Provide a brief overview of this BCC</small>
          </div>

          <!-- Location & Schedule -->
          <div class="form-section-header full-width">
            <h3>Location & Schedule</h3>
          </div>

          <div class="form-group">
            <label>Meeting Place</label>
            <input 
              type="text" 
              formControlName="meeting_place" 
              class="form-control"
              placeholder="e.g., Church Hall, Community Center, Member's Home"
            />
            <small class="form-hint">Regular meeting location for this BCC</small>
          </div>

          <div class="form-group">
            <label>Meeting Day</label>
            <select formControlName="meeting_day" class="form-control">
              <option value="">Select Day</option>
              <option *ngFor="let day of weekDays" [value]="day.value">
                {{ day.label }}
              </option>
            </select>
            <small class="form-hint">Day of the week when BCC meets</small>
          </div>

          <div class="form-group">
            <label>Meeting Time</label>
            <input 
              type="time" 
              formControlName="meeting_time" 
              class="form-control"
            />
            <small class="form-hint">Regular meeting time</small>
          </div>

          <div class="form-group">
            <label>Meeting Frequency</label>
            <select formControlName="meeting_frequency" class="form-control">
              <option value="">Select Frequency</option>
              <option *ngFor="let freq of frequencies" [value]="freq">
                {{ freq }}
              </option>
            </select>
            <small class="form-hint">How often the BCC meets</small>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button 
          type="button" 
          class="btn btn-secondary" 
          (click)="onCancel()" 
          [disabled]="loading"
        >
          Cancel
        </button>
        <button 
          type="submit" 
          class="btn btn-primary" 
          [disabled]="!bccForm.valid || loading"
        >
          <span *ngIf="!loading">
            <span class="icon">💾</span> Save BCC
          </span>
          <span *ngIf="loading">Saving...</span>
        </button>
      </div>
    </form>
  </div>
</div>
