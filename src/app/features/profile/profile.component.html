<div class="profile-container" *ngIf="currentUser$ | async as user">
  <div class="profile-header">
    <h1 class="page-title">Profile</h1>
    <p class="page-description">Manage your account information</p>
  </div>

  <div class="profile-content">
    <div class="profile-card">
      <div class="profile-avatar-section">
        <div class="profile-avatar">
          <span class="avatar-text">{{ getInitials(user.name) }}</span>
        </div>
        <h2 class="profile-name">{{ user.name }}</h2>
        <p class="profile-email">{{ user.email }}</p>
      </div>

      <div class="profile-divider"></div>

      <div class="profile-info-section">
        <h3 class="section-title">Account Information</h3>
        
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">Full Name</span>
            <span class="info-value">{{ user.name }}</span>
          </div>

          <div class="info-item">
            <span class="info-label">Email Address</span>
            <span class="info-value">{{ user.email }}</span>
          </div>

          <div class="info-item">
            <span class="info-label">User ID</span>
            <span class="info-value">#{{ user.id }}</span>
          </div>

          <div class="info-item">
            <span class="info-label">Account Status</span>
            <span class="info-value">
              <span class="status-badge active">Active</span>
            </span>
          </div>
        </div>
      </div>

      <div class="profile-divider"></div>

      <div class="profile-actions">
        <button class="btn-edit" disabled type="button" title="Edit profile information">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>Edit Profile</span>
        </button>
        <button class="btn-settings" disabled type="button" title="Change password">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Change Password</span>
        </button>
      </div>
    </div>
  </div>
</div>
