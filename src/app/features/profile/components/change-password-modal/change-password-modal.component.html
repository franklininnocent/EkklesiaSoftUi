<app-modal-shell
  title="Change password"
  size="sm"
  headerVariant="compact"
  bodyPadding="none"
  closeAriaLabel="Close change password"
  [isSubmitting]="isSavingPassword"
  (closeRequested)="onCloseRequested()"
>
  <form
    id="change-password-form"
    class="cf-split-form-body change-password-modal"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
  >
    <p class="cf-split-form-alert cf-split-form-alert--error" *ngIf="errorMessage" role="alert">
      {{ errorMessage }}
    </p>

    <section class="cf-split-section" aria-labelledby="pw-section">
      <h3 id="pw-section" class="cf-split-section__title">Password</h3>
      <div class="cf-split-grid">
        <div class="cf-split-field cf-split-field--full">
          <label for="current_password">
            Current password <span class="cf-split-req" aria-hidden="true">*</span>
          </label>
          <input
            type="password"
            id="current_password"
            formControlName="current_password"
            autocomplete="current-password"
            aria-required="true"
            [class.cf-split-field__control--invalid]="hasError('current_password')"
          />
          <p class="cf-split-field__error" *ngIf="hasError('current_password')">
            Current password is required.
          </p>
        </div>

        <div class="cf-split-field cf-split-field--full">
          <label for="password">
            New password <span class="cf-split-req" aria-hidden="true">*</span>
          </label>
          <input
            type="password"
            id="password"
            formControlName="password"
            autocomplete="new-password"
            aria-required="true"
            [class.cf-split-field__control--invalid]="hasError('password')"
          />
          <p class="cf-split-field__error" *ngIf="hasError('password')">
            New password is required.
          </p>
        </div>

        <div class="cf-split-field cf-split-field--full">
          <label for="password_confirmation">
            Confirm new password <span class="cf-split-req" aria-hidden="true">*</span>
          </label>
          <input
            type="password"
            id="password_confirmation"
            formControlName="password_confirmation"
            autocomplete="new-password"
            aria-required="true"
            [class.cf-split-field__control--invalid]="hasError('password_confirmation') || form.hasError('passwordMismatch')"
          />
          <p
            class="cf-split-field__error"
            *ngIf="form.hasError('passwordMismatch') && form.get('password_confirmation')?.touched"
          >
            Password confirmation does not match.
          </p>
          <p class="cf-split-field__error" *ngIf="hasError('password_confirmation') && !form.hasError('passwordMismatch')">
            Password confirmation is required.
          </p>
        </div>

        <ul class="password-policy-list cf-split-field--full" aria-label="Password requirements">
          <li [class.met]="passwordChecks.minLength">At least 8 characters</li>
          <li [class.met]="passwordChecks.uppercase">One uppercase letter</li>
          <li [class.met]="passwordChecks.lowercase">One lowercase letter</li>
          <li [class.met]="passwordChecks.number">One number</li>
          <li [class.met]="passwordChecks.special">One special character (@$!%*?&)</li>
        </ul>
      </div>
    </section>

    <div class="cf-split-form-actions">
      <button type="submit" class="cf-btn cf-btn-primary" [disabled]="isSavingPassword">
        {{ isSavingPassword ? 'Saving…' : 'Change password' }}
      </button>
      <button type="button" class="cf-btn" *ngIf="!forced" (click)="close()" [disabled]="isSavingPassword">
        Cancel
      </button>
    </div>
  </form>
</app-modal-shell>
