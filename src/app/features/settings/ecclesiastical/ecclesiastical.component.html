<div class="ecclesiastical-container">
  <!-- Header -->
  <div class="ecclesiastical-header">
    <h1 class="ecclesiastical-title">Ecclesiastical Data Management</h1>
    <p class="ecclesiastical-subtitle">Manage dioceses, bishops, and church hierarchy</p>
  </div>

  <!-- Navigation Tabs -->
  <div class="ecclesiastical-nav">
    <a 
      routerLink="overview" 
      routerLinkActive="active"
      class="nav-tab">
      <span class="tab-icon">📊</span>
      <span>Overview</span>
    </a>
    <a 
      routerLink="dioceses" 
      routerLinkActive="active"
      class="nav-tab">
      <span class="tab-icon">⛪</span>
      <span>Dioceses</span>
    </a>
    <a 
      routerLink="bishops" 
      routerLinkActive="active"
      class="nav-tab">
      <span class="tab-icon">👤</span>
      <span>Bishops</span>
    </a>
    <a 
      *ngIf="hasEkklesiaRole"
      routerLink="pope-details" 
      routerLinkActive="active"
      class="nav-tab">
      <span class="tab-icon">👑</span>
      <span>Pope Details</span>
    </a>
  </div>

  <!-- Content Area -->
  <div class="ecclesiastical-content">
    <router-outlet></router-outlet>
  </div>
</div>
