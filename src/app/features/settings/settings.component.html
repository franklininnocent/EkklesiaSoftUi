<div class="settings-container">
  <!-- Page Header with Breadcrumb -->
  <div class="settings-header">
    <div class="header-content">
      <div class="breadcrumb">
        <span class="breadcrumb-item">Home</span>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-item active">Settings</span>
      </div>
      <h1 class="settings-title">Settings</h1>
      <p class="settings-subtitle">Manage your workspace, security, and preferences</p>
    </div>
  </div>

  <!-- Settings Grid -->
  <div class="settings-grid">
    <div 
      *ngFor="let section of visibleSections$ | async; let i = index"
      class="setting-card"
      [style.animation-delay.ms]="i * 50"
      (click)="onConfigure(section)"
      [attr.aria-label]="'Configure ' + section.title"
      role="button"
      tabindex="0"
      (keydown.enter)="onConfigure(section)"
      (keydown.space)="onConfigure(section)">
      
      <!-- Card Content -->
      <div class="card-content">
        <!-- Icon -->
        <div class="setting-icon-wrapper">
          <div class="setting-icon" role="img" [attr.aria-label]="section.title + ' icon'">
            <!-- User Icon -->
            <svg *ngIf="section.icon === 'user'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <!-- Lock Icon -->
            <svg *ngIf="section.icon === 'lock'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <!-- Bell Icon -->
            <svg *ngIf="section.icon === 'bell'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <!-- Credit Card Icon -->
            <svg *ngIf="section.icon === 'credit-card'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
            <!-- Users Icon -->
            <svg *ngIf="section.icon === 'users'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <!-- Link Icon -->
            <svg *ngIf="section.icon === 'link'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <!-- Building Icon -->
            <svg *ngIf="section.icon === 'building'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="3" y1="15" x2="21" y2="15"></line>
            </svg>
            <!-- Shield Icon -->
            <svg *ngIf="section.icon === 'shield'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <!-- Church Icon -->
            <svg *ngIf="section.icon === 'church'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <!-- Crown Icon -->
            <svg *ngIf="section.icon === 'crown'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M5 15l-1-4 4-1 1-4 3 3 3-3 1 4 4 1-4 1-1 4-3-3-3 3z"></path>
              <path d="M12 3v18"></path>
            </svg>
            <!-- Cross Icon -->
            <svg *ngIf="section.icon === 'cross'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            <!-- File Icon -->
            <svg *ngIf="section.icon === 'file'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <!-- Settings Icon (default) -->
            <svg *ngIf="section.icon === 'settings' || !section.icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 1v6m0 6v6m0-13a2 2 0 0 1 2 2m0 0a2 2 0 0 1-2 2m0-4a2 2 0 0 0-2 2m0 0a2 2 0 0 0 2 2m-5.5 5.5l5.5-5.5m0 0l5.5 5.5M1 12h6m6 0h6"></path>
            </svg>
          </div>
        </div>

        <!-- Text Content -->
        <div class="setting-text">
          <h3 class="setting-title">{{ section.title }}</h3>
          <p class="setting-description">{{ section.description }}</p>
        </div>

        <!-- Action Arrow -->
        <div class="setting-arrow">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- Hover Effect Overlay -->
      <div class="card-overlay"></div>
      
      <!-- Top Accent Border -->
      <div class="card-accent"></div>
    </div>
  </div>

  <!-- Empty State (if no cards visible) -->
  <div 
    *ngIf="(visibleSections$ | async)?.length === 0" 
    class="empty-state"
    role="status"
    aria-live="polite">
    <div class="empty-icon" [innerHTML]="getIconSvg('settings')"></div>
    <h3 class="empty-title">No Settings Available</h3>
    <p class="empty-message">You don't have access to any settings sections. Please contact your administrator.</p>
  </div>
</div>
