<app-modal-shell
  [title]="title"
  [isSubmitting]="saving || loading"
  (closeRequested)="onCancel()"
>
  <div class="cf-loading-block" *ngIf="loading" role="status" aria-live="polite">
    <p class="cf-loading-block__label">Loading guest…</p>
  </div>

  <div class="cf-inline-alert" *ngIf="loadError" role="alert">
    <p>{{ loadError }}</p>
  </div>

  <form
    id="guest-member-form"
    *ngIf="!loading && !loadError"
    class="guest-member-form-modal__body"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <div class="cf-form-grid">
      <app-form-field
        label="First name"
        [required]="true"
        fieldId="guest-first-name"
        [errorText]="
          submitted && form.controls.first_name.hasError('required')
            ? 'First name is required.'
            : null
        "
      >
        <input
          id="guest-first-name"
          type="text"
          formControlName="first_name"
          autocomplete="given-name"
        />
      </app-form-field>

      <app-form-field
        label="Last name"
        [required]="true"
        fieldId="guest-last-name"
        [errorText]="
          submitted && form.controls.last_name.hasError('required')
            ? 'Last name is required.'
            : null
        "
      >
        <input
          id="guest-last-name"
          type="text"
          formControlName="last_name"
          autocomplete="family-name"
        />
      </app-form-field>

      <app-form-field
        label="Phone"
        fieldId="guest-phone"
        [errorText]="
          phoneError
            ? phoneError
            : submitted && form.controls.phone.hasError('maxlength')
              ? 'Phone must be 20 characters or fewer.'
              : null
        "
      >
        <input
          id="guest-phone"
          type="tel"
          formControlName="phone"
          autocomplete="tel"
          maxlength="20"
        />
      </app-form-field>

      <app-form-field
        label="Email"
        fieldId="guest-email"
        [errorText]="
          emailError
            ? emailError
            : submitted && form.controls.email.hasError('email')
              ? 'Enter a valid email address.'
              : null
        "
      >
        <input
          id="guest-email"
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </app-form-field>

      <app-form-field label="Gender" fieldId="guest-gender">
        <select id="guest-gender" formControlName="gender">
          <option value="">Prefer not to say</option>
          <option *ngFor="let option of genderOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </app-form-field>

      <app-form-field label="Guest type" fieldId="guest-type">
        <select id="guest-type" formControlName="guest_type">
          <option *ngFor="let option of guestTypeOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </app-form-field>

      <app-form-field label="Support type" fieldId="guest-support-type">
        <select id="guest-support-type" formControlName="support_type">
          <option value="">None</option>
          <option *ngFor="let option of supportTypeOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </app-form-field>

      <app-form-field label="External organization" fieldId="guest-external-org">
        <input
          id="guest-external-org"
          type="text"
          formControlName="external_organization"
          maxlength="255"
        />
      </app-form-field>
    </div>

    <p
      class="cf-form-field__error"
      *ngIf="submitted && form.hasError('phoneOrEmail')"
      role="alert"
    >
      Enter a phone number or an email address.
    </p>

    <app-form-field label="Address" fieldId="guest-address">
      <textarea id="guest-address" formControlName="address" rows="2"></textarea>
    </app-form-field>

    <app-form-field label="Remarks" fieldId="guest-remarks">
      <textarea id="guest-remarks" formControlName="remarks" rows="2"></textarea>
    </app-form-field>

    <p class="cf-form-field__error" *ngIf="formError" role="alert">{{ formError }}</p>
  </form>

  <ng-container modalFooter>
    <ng-container *ngIf="loadError">
      <button type="button" class="cf-btn" (click)="onCancel()">Close</button>
    </ng-container>
    <ng-container *ngIf="!loading && !loadError">
      <button type="button" class="cf-btn" (click)="onCancel()" [disabled]="saving">
        Cancel
      </button>
      <button
        type="submit"
        form="guest-member-form"
        class="cf-btn cf-btn-primary"
        [disabled]="saving"
      >
        {{ submitLabel }}
      </button>
    </ng-container>
  </ng-container>
</app-modal-shell>
