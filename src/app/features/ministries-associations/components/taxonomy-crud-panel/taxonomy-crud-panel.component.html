<div class="taxonomy-crud-panel">
  <div
    class="cf-loading-block cf-panel"
    *ngIf="!loaded"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <app-loading-skeleton label="Loading {{ listTitle.toLowerCase() }}…" type="table" [rows]="5" [columns]="5"></app-loading-skeleton>
  </div>

  <ng-container *ngIf="loaded">
    <div class="cf-inline-alert cf-panel" *ngIf="loadError" role="alert">
      <p>{{ loadError }}</p>
      <button type="button" class="cf-btn cf-btn-primary" (click)="load()">Try again</button>
    </div>

    <div class="taxonomy-crud-panel__content" *ngIf="!loadError">
      <div class="cf-inline-alert cf-panel" *ngIf="statusError" role="alert">
        <p>{{ statusError }}</p>
        <button type="button" class="cf-btn" (click)="clearStatusError()">Dismiss</button>
      </div>

      <div class="taxonomy-crud-panel__toolbar-row">
        <div class="taxonomy-crud-panel__filter-chips" *ngIf="activeFilterChips.length">
          <app-cf-active-filter-chips
            class="cf-active-filters--embedded"
            [chips]="activeFilterChips"
            [showClearAll]="activeFilterChips.length > 1"
            (remove)="onActiveFilterChipRemove($event)"
            (clearAll)="clearAllListFilters()"
          />
        </div>

        <app-list-toolbar
          class="taxonomy-crud-panel__toolbar"
          [searchPlaceholder]="'Search ' + listTitle.toLowerCase() + '…'"
          [searchValue]="tableSearch"
          [filterCount]="drawerFilterCount"
          (searchChange)="onSearchChange($event)"
          (filtersOpened)="showFilters = true"
        >
        <ng-container *ngIf="canConfigure">
          <button
            type="button"
            class="cf-btn cf-btn-icon"
            (click)="editSelected()"
            [disabled]="!selectedItem"
            [attr.aria-label]="editSelectedAriaLabel"
            [attr.title]="editSelectedAriaLabel"
          >
            <app-cf-action-icon name="pencil" />
          </button>
          <button
            type="button"
            class="cf-btn cf-btn-icon"
            (click)="toggleStatusSelected()"
            [disabled]="!canToggleStatusSelected"
            [attr.aria-label]="statusSelectedAriaLabel"
            [attr.title]="statusSelectedAriaLabel"
            [attr.aria-busy]="statusUpdatingSelected"
          >
            <app-cf-action-icon [name]="statusSelectedIcon" />
          </button>
          <button
            type="button"
            class="cf-btn cf-btn-icon cf-btn-primary"
            (click)="openCreateForm()"
            [attr.aria-label]="addActionLabel"
            [attr.title]="addActionLabel"
          >
            <app-cf-action-icon name="plus" />
          </button>
        </ng-container>
        </app-list-toolbar>
      </div>

      <ng-container *ngIf="filteredItems.length; else emptyList">
        <div class="cf-panel taxonomy-crud-panel__panel">
          <app-data-table>
            <thead>
              <tr>
                <th *ngIf="canConfigure" scope="col" class="taxonomy-crud-panel__select-col">
                  Select
                </th>
                <th
                  scope="col"
                  appSortable="code"
                  [direction]="sortBy === 'code' ? sortDir : null"
                  (sort)="onSort($event)"
                >
                  Code
                </th>
                <th
                  scope="col"
                  appSortable="name"
                  [direction]="sortBy === 'name' ? sortDir : null"
                  (sort)="onSort($event)"
                >
                  Name
                </th>
                <th
                  scope="col"
                  appSortable="description"
                  [direction]="sortBy === 'description' ? sortDir : null"
                  (sort)="onSort($event)"
                >
                  Description
                </th>
                <th
                  scope="col"
                  appSortable="display_order"
                  [direction]="sortBy === 'display_order' ? sortDir : null"
                  (sort)="onSort($event)"
                >
                  Order
                </th>
                <th
                  *ngIf="isPositionsKind"
                  scope="col"
                  appSortable="single_occupancy"
                  [direction]="sortBy === 'single_occupancy' ? sortDir : null"
                  (sort)="onSort($event)"
                >
                  Occupancy
                </th>
                <th
                  scope="col"
                  appSortable="is_active"
                  [direction]="sortBy === 'is_active' ? sortDir : null"
                  (sort)="onSort($event)"
                >
                  Status
                </th>
              </tr>
            </thead>
            <tbody>
              <tr
                *ngFor="let item of filteredItems"
                [class.taxonomy-crud-panel__row--inactive]="!item.is_active"
                [class.taxonomy-crud-panel__row--selected]="isSelected(item)"
                [attr.aria-selected]="isSelected(item)"
              >
                <td *ngIf="canConfigure" class="taxonomy-crud-panel__select-col">
                  <input
                    type="checkbox"
                    [checked]="isSelected(item)"
                    (change)="onSelectItem(item, $any($event.target).checked)"
                    [attr.aria-label]="'Select ' + item.name"
                  />
                </td>
                <td>{{ item.code }}</td>
                <td><strong>{{ item.name }}</strong></td>
                <td>
                  <span
                    class="taxonomy-crud-panel__desc"
                    [attr.title]="item.description || null"
                  >
                    {{ item.description || '—' }}
                  </span>
                </td>
                <td>{{ item.display_order }}</td>
                <td *ngIf="isPositionsKind">{{ occupancyLabel(item) }}</td>
                <td>
                  <app-status-badge
                    [label]="statusLabel(item)"
                    [tone]="statusTone(item)"
                  ></app-status-badge>
                </td>
              </tr>
            </tbody>
          </app-data-table>
        </div>
      </ng-container>

      <ng-template #emptyList>
        <app-cf-empty-state
          *ngIf="items.length && !filteredItems.length"
          icon="◇"
          [title]="'No ' + listTitle.toLowerCase() + ' match your filters'"
          [description]="
            hasActiveFilters
              ? 'Try clearing search or filters.'
              : 'Try a different search term.'
          "
          [hasActions]="false"
        ></app-cf-empty-state>

        <app-cf-empty-state
          *ngIf="!items.length"
          icon="◇"
          [title]="'No ' + listTitle.toLowerCase()"
          [description]="
            kind === 'positions'
              ? 'Add recommended positions in Settings, or add the offices your organizations use.'
              : 'Add recommended labels in Settings, or add custom labels before creating organizations.'
          "
          [hasActions]="canConfigure"
        >
          <a
            routerLink="/settings/default-seeds"
            [queryParams]="{ module: 'ministries' }"
            class="cf-btn cf-btn-primary"
          >
            Add recommended defaults
          </a>
          <button
            type="button"
            class="cf-btn"
            *ngIf="canConfigure"
            (click)="openCreateForm()"
          >
            Add {{ singularLabel }}
          </button>
        </app-cf-empty-state>
      </ng-template>
    </div>
  </ng-container>

  <app-modal-shell
    *ngIf="showForm"
    [title]="formTitle"
    [isSubmitting]="saving"
    (closeRequested)="closeForm()"
  >
    <form
      id="taxonomy-crud-form"
      class="taxonomy-crud-panel__form"
      [formGroup]="form"
      (ngSubmit)="save()"
      novalidate
    >
      <div class="cf-form-grid">
        <app-form-field
          label="Name"
          [required]="true"
          fieldId="taxonomy-name"
          [errorText]="nameErrorText()"
        >
          <input
            id="taxonomy-name"
            formControlName="name"
            [placeholder]="
              kind === 'positions'
                ? 'President'
                : kind === 'types'
                  ? 'Standing'
                  : 'Parish Council'
            "
            maxlength="100"
            autocomplete="off"
          />
        </app-form-field>

        <app-form-field
          label="Code"
          [required]="true"
          fieldId="taxonomy-code"
          [helpText]="editingId ? 'Code cannot be changed after create.' : undefined"
          [errorText]="codeErrorText()"
        >
          <input
            id="taxonomy-code"
            formControlName="code"
            [placeholder]="
              kind === 'positions'
                ? 'president'
                : kind === 'types'
                  ? 'standing'
                  : 'parish-council'
            "
            maxlength="50"
            autocomplete="off"
          />
        </app-form-field>

        <app-form-field
          label="Order"
          fieldId="taxonomy-order"
          [optionalLabel]="true"
          [errorText]="orderErrorText()"
        >
          <input
            id="taxonomy-order"
            type="number"
            formControlName="display_order"
            min="0"
            step="1"
          />
        </app-form-field>

        <app-form-field
          *ngIf="!isPositionsKind"
          label="Description"
          fieldId="taxonomy-description"
          [optionalLabel]="true"
          [errorText]="fieldError('description')"
          [wide]="true"
        >
          <textarea
            id="taxonomy-description"
            formControlName="description"
            rows="3"
            placeholder="Brief note for volunteers"
          ></textarea>
        </app-form-field>
      </div>

      <label class="cf-switch-field">
        <input type="checkbox" formControlName="is_active" />
        <span class="cf-switch-field__copy">
          <span class="cf-switch-field__label">Active</span>
          <small>Inactive items are hidden from new organization and leadership forms.</small>
        </span>
      </label>

      <label class="cf-switch-field" *ngIf="isPositionsKind">
        <input type="checkbox" formControlName="single_occupancy" />
        <span class="cf-switch-field__copy">
          <span class="cf-switch-field__label">Single occupancy</span>
          <small>Only one active holder allowed for this position in an organization.</small>
        </span>
      </label>

      <p class="cf-form-field__error" *ngIf="formError" role="alert">{{ formError }}</p>
    </form>

    <ng-container modalFooter>
      <button type="button" class="cf-btn" (click)="closeForm()" [disabled]="saving">Cancel</button>
      <button
        type="submit"
        form="taxonomy-crud-form"
        class="cf-btn cf-btn-primary"
        [disabled]="saving"
      >
        {{ submitLabel }}
      </button>
    </ng-container>
  </app-modal-shell>

  <app-advanced-search-panel
    mode="sidepanel"
    [fields]="searchFields"
    [isExpanded]="showFilters"
    (search)="onAdvancedSearch($event)"
    (clear)="onClearAdvancedSearch()"
    (close)="showFilters = false"
  ></app-advanced-search-panel>

  <app-confirmation-modal
    [show]="confirmDeactivateOpen"
    [title]="deactivateConfirmTitle"
    [message]="deactivateConfirmMessage"
    confirmText="Deactivate"
    cancelText="Cancel"
    confirmButtonClass="btn-danger"
    (confirmed)="onDeactivateConfirmed($event)"
    (cancelled)="closeDeactivateConfirm()"
    (closed)="closeDeactivateConfirm()"
  ></app-confirmation-modal>
</div>
