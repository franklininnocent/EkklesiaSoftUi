<div class="auth-container">
  <div class="auth-box">
    <div class="auth-header">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Sign up to get started</p>
    </div>

    <div class="auth-card">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group cf-form-field">
          <label class="cf-form-field__label" for="register-name">
            <span>Full Name</span>
            <span class="cf-form-field__required" aria-hidden="true">*</span>
          </label>
          <input
            id="register-name"
            type="text"
            class="auth-native-input"
            placeholder="Enter your full name"
            formControlName="name"
            autocomplete="name"
            aria-required="true"
            [class.cf-form-field__control--invalid]="!!getErrorMessage('name')"
            [attr.aria-invalid]="getErrorMessage('name') ? 'true' : null"
            [attr.aria-describedby]="getErrorMessage('name') ? 'register-name-error' : null"
          />
          <p *ngIf="getErrorMessage('name') as message" id="register-name-error" class="cf-form-field__error">{{ message }}</p>
        </div>

        <div class="form-group cf-form-field">
          <label class="cf-form-field__label" for="register-email">
            <span>Email Address</span>
            <span class="cf-form-field__required" aria-hidden="true">*</span>
          </label>
          <input
            id="register-email"
            type="email"
            class="auth-native-input"
            placeholder="Enter your email"
            formControlName="email"
            autocomplete="email"
            aria-required="true"
            [class.cf-form-field__control--invalid]="!!getErrorMessage('email')"
            [attr.aria-invalid]="getErrorMessage('email') ? 'true' : null"
            [attr.aria-describedby]="getErrorMessage('email') ? 'register-email-error' : null"
          />
          <p *ngIf="getErrorMessage('email') as message" id="register-email-error" class="cf-form-field__error">{{ message }}</p>
        </div>

        <div class="form-group cf-form-field">
          <label class="cf-form-field__label" for="register-password">
            <span>Password</span>
            <span class="cf-form-field__required" aria-hidden="true">*</span>
          </label>
          <input
            id="register-password"
            type="password"
            class="auth-native-input"
            placeholder="Enter your password"
            formControlName="password"
            autocomplete="new-password"
            aria-required="true"
            [class.cf-form-field__control--invalid]="!!getErrorMessage('password')"
            [attr.aria-invalid]="getErrorMessage('password') ? 'true' : null"
            [attr.aria-describedby]="getErrorMessage('password') ? 'register-password-error' : null"
          />
          <p *ngIf="getErrorMessage('password') as message" id="register-password-error" class="cf-form-field__error">{{ message }}</p>
        </div>

        <div class="form-group cf-form-field">
          <label class="cf-form-field__label" for="register-password-confirmation">
            <span>Confirm Password</span>
            <span class="cf-form-field__required" aria-hidden="true">*</span>
          </label>
          <input
            id="register-password-confirmation"
            type="password"
            class="auth-native-input"
            placeholder="Confirm your password"
            formControlName="password_confirmation"
            autocomplete="new-password"
            aria-required="true"
            [class.cf-form-field__control--invalid]="!!getErrorMessage('password_confirmation')"
            [attr.aria-invalid]="getErrorMessage('password_confirmation') ? 'true' : null"
            [attr.aria-describedby]="getErrorMessage('password_confirmation') ? 'register-password-confirmation-error' : null"
          />
          <p *ngIf="getErrorMessage('password_confirmation') as message" id="register-password-confirmation-error" class="cf-form-field__error">{{ message }}</p>
        </div>

        <div *ngIf="error$ | async as error" class="error-banner" role="alert" aria-live="polite">
          {{ error }}
        </div>

        <ng-container *ngIf="{ busy: (loading$ | async) ?? false } as state">
          <button
            type="submit"
            class="cf-btn cf-btn-primary auth-submit"
            [disabled]="state.busy"
            [attr.aria-busy]="state.busy"
          >
            <span *ngIf="state.busy" class="cf-spinner" aria-hidden="true"></span>
            Create Account
          </button>
        </ng-container>

        <div class="auth-footer">
          <p>
            Already have an account?
            <a routerLink="/auth/login" class="auth-link">Sign in</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
