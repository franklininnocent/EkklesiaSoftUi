<button
  type="button"
  class="section-collapse-toggle"
  [class.section-collapse-toggle--expanded]="expanded"
  [attr.aria-expanded]="expanded"
  [attr.aria-label]="ariaLabel"
  [attr.title]="ariaLabel"
  (click)="onClick()"
>
  <svg
    class="section-collapse-toggle__chevron"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="m6 9 6 6 6-6"></path>
  </svg>
</button>
