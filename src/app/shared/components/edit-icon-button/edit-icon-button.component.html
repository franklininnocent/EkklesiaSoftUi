<button
  type="button"
  class="app-edit-icon-btn"
  [class.app-edit-icon-btn--sm]="size === 'sm'"
  [class.app-edit-icon-btn--on-dark]="variant === 'on-dark'"
  [disabled]="disabled"
  (click)="onClick()"
  [attr.aria-label]="ariaLabel"
  [attr.title]="title || ariaLabel"
>
  <svg
    class="app-edit-icon-btn__icon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
  </svg>
</button>
