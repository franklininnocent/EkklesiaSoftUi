<header class="cf-page-header" [class.cf-hero]="variant === 'page'">
  <div class="cf-page-header__identity">
    <a *ngIf="backLink" [routerLink]="backLink" class="cf-page-header__back">← {{ backLabel }}</a>

    <div class="cf-page-header__title-row">
      <h1 *ngIf="variant === 'page' && titleLevel === 1" class="cf-page-header__title">{{ title }}</h1>
      <h3 *ngIf="variant === 'page' && titleLevel === 3" class="cf-page-header__title">{{ title }}</h3>
      <h2 *ngIf="variant === 'panel'" class="cf-page-header__title">{{ title }}</h2>
      <app-status-badge *ngIf="statusLabel" [label]="statusLabel" [tone]="statusTone"></app-status-badge>
      <span
        *ngIf="titleMetaCount != null && titleMetaCount > 0"
        class="cf-page-header__count cf-badge cf-badge--info"
        [attr.aria-label]="titleMetaCount + ' active filters'"
      >
        {{ titleMetaCount }}
      </span>
    </div>

    <p *ngIf="subtitle">{{ subtitle }}</p>

    <div class="cf-page-header__below">
      <ng-content select="[pageHeaderBelow]"></ng-content>
    </div>
  </div>

  <div class="cf-page-header__actions">
    <ng-content></ng-content>
  </div>
</header>
