<div
  class="cf-modal-shell__overlay"
  [class.cf-modal-shell__overlay--nested]="nested || !overlayTop"
  [class.cf-modal-shell__overlay--media]="layout === 'media'"
  [class.cf-modal-shell__overlay--covered]="!overlayTop"
  [style.z-index]="overlayZIndex"
  [attr.inert]="overlayTop ? null : ''"
  [attr.aria-hidden]="overlayTop ? null : true"
  (click)="onBackdropClick()"
>
  <div
    #dialogEl
    class="cf-modal-shell__dialog"
    [class.cf-modal-shell__dialog--xs]="size === 'xs'"
    [class.cf-modal-shell__dialog--sm]="size === 'sm'"
    [class.cf-modal-shell__dialog--md]="size === 'md'"
    [class.cf-modal-shell__dialog--lg]="size === 'lg'"
    [class.cf-modal-shell__dialog--xl]="size === 'xl'"
    [class.cf-modal-shell__dialog--full]="size === 'full'"
    [class.cf-modal-shell__dialog--media]="layout === 'media'"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title ? resolvedTitleId : null"
    [attr.aria-describedby]="description ? resolvedDescId : null"
    [attr.aria-label]="!title ? ariaLabel : null"
    (click)="$event.stopPropagation()"
  >
    <header
      class="cf-modal-shell__header"
      [class.cf-modal-shell__header--compact]="headerVariant === 'compact'"
    >
      <div class="cf-modal-shell__heading">
        <h2 *ngIf="title" [id]="resolvedTitleId" class="cf-modal-shell__title">{{ title }}</h2>
        <p
          *ngIf="description"
          [id]="resolvedDescId"
          class="cf-modal-shell__description"
        >
          {{ description }}
        </p>
      </div>
      <button
        *ngIf="headerVariant === 'compact'; else defaultModalClose"
        type="button"
        class="cf-btn cf-btn-icon cf-modal-shell__close--compact"
        [disabled]="isSubmitting"
        [attr.aria-label]="closeAriaLabel"
        (click)="onCloseClick()"
      >
        <app-cf-action-icon name="x" />
      </button>
      <ng-template #defaultModalClose>
        <button
          type="button"
          class="cf-modal-shell__close"
          [disabled]="isSubmitting"
          [attr.aria-label]="closeAriaLabel"
          (click)="onCloseClick()"
        >
          <app-cf-action-icon name="x" />
        </button>
      </ng-template>
    </header>

    <div
      class="cf-modal-shell__body"
      [class.cf-modal-shell__body--flush]="bodyPadding === 'none'"
      [class.cf-modal-shell__body--media]="layout === 'media'"
      [class.cf-modal-shell__body--loading]="loading"
      [attr.aria-busy]="loading || isSubmitting || null"
    >
      <app-cf-brand-loader
        *ngIf="loading"
        size="section"
        [label]="loadingLabel"
        [overlay]="true"
      />
      <ng-content></ng-content>
    </div>

    <footer class="cf-modal-shell__footer">
      <ng-content select="[modalFooter]"></ng-content>
    </footer>
  </div>
</div>
