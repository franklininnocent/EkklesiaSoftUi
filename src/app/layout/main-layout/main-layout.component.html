<div class="layout">
  @if (isMobileNavOpen) {
    <button
      type="button"
      class="sidebar-backdrop"
      aria-label="Close navigation menu"
      (click)="closeMobileNav()"
    ></button>
  }

  <aside
    class="sidebar"
    [class.collapsed]="isSidebarCollapsed && !isMobileViewport"
    [class.mobile-open]="isMobileNavOpen"
  >
    <div class="sidebar-header">
      <h2 class="sidebar-logo">{{ (currentTenant$ | async)?.name || 'EkklesiaSoft' }}</h2>
      <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Application">
      <app-sidebar-nav-forest
        [sections]="visibleSidebarSections"
        [collapsed]="isSidebarCollapsed && !isMobileNavOpen"
      />
    </nav>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" (click)="toggleMobileNav()" aria-label="Toggle mobile menu">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="tenant-info" *ngIf="currentTenant$ | async as tenant">
          <div class="tenant-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <div class="tenant-details">
            <span class="tenant-label">Organization</span>
            <span class="tenant-name">{{ tenant.name }}</span>
          </div>
        </div>
      </div>

      <div class="topbar-center" *ngIf="hasParishContext((currentUser$ | async))">
        <app-global-family-search></app-global-family-search>
      </div>
      
      <div class="topbar-right">
        <app-notification-bell *ngIf="currentUser"></app-notification-bell>
        <button
          *ngIf="isVisible('donations', currentUser)"
          type="button"
          class="collect-btn"
          [disabled]="isSubscriptionReadOnly()"
          [attr.aria-disabled]="isSubscriptionReadOnly()"
          [title]="isSubscriptionReadOnly() ? 'Read-only: renew subscription to collect' : 'Quick collect'"
          (click)="openQuickCollect()"
        >
          + Collect
        </button>
        <div class="user-menu" *ngIf="currentUser$ | async as user">
          <div class="user-dropdown" [class.open]="isUserMenuOpen && !isUserMenuClosing">
            <button class="user-trigger" (click)="toggleUserMenu($event)">
              <app-user-avatar
                class="user-trigger-avatar"
                [name]="user.name"
                [imageUrl]="getUserPhotoUrl(user)"
                [clickable]="false"
              ></app-user-avatar>
              <span class="user-name">{{ user.name }}</span>
              <span class="dropdown-arrow">▾</span>
            </button>
            
            <div class="dropdown-panel" 
                 *ngIf="isUserMenuOpen || isUserMenuClosing" 
                 [class.closing]="isUserMenuClosing"
                 (click)="$event.stopPropagation()">
              <div class="dropdown-header">
                <div class="user-info">
                  <app-user-avatar
                    [name]="user.name"
                    [imageUrl]="getUserPhotoUrl(user)"
                    size="lg"
                    (photoClick)="openPhotoViewer(user, $event)"
                  ></app-user-avatar>
                  <div class="user-details">
                    <div class="user-name-large">{{ user.name }}</div>
                    <div class="user-email">{{ user.email }}</div>
                  </div>
                </div>
              </div>
              
              <div class="dropdown-divider"></div>
              
              <div class="dropdown-menu">
                <button class="dropdown-item" (click)="navigateToProfile()" aria-label="View profile">
                  <span class="item-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                  </span>
                  <span class="item-text">Profile</span>
                </button>

                <button class="dropdown-item" (click)="navigateToChangePassword()" aria-label="Change password">
                  <span class="item-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                  </span>
                  <span class="item-text">Change password</span>
                </button>
                
                <div class="dropdown-divider"></div>
                
                <button class="dropdown-item logout" (click)="logout()" aria-label="Logout">
                  <span class="item-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                      <polyline points="16 17 21 12 16 7"></polyline>
                      <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                  </span>
                  <span class="item-text">Logout</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <app-support-session-banner></app-support-session-banner>
    <app-subscription-status-banner></app-subscription-status-banner>

    <main class="page-content">
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <p class="footer-text">All rights reserved © EkklesiaSoft {{ currentYear }}</p>
      </div>
    </footer>
  </div>

  <app-quick-collect-drawer></app-quick-collect-drawer>
  <app-notification-popover></app-notification-popover>
  <app-command-palette></app-command-palette>

  <app-image-viewer
    *ngIf="photoViewer as viewer"
    [src]="viewer.src"
    [alt]="viewer.alt"
    [title]="viewer.title"
    [subtitle]="viewer.subtitle"
    (closeRequested)="closePhotoViewer()"
  ></app-image-viewer>
</div>
